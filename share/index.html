<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Read a Quran verse, Hadith, or Dua shared from the Rafiq app.">
  <meta name="theme-color" content="#103d2f">
  <title>Shared from Rafiq | atlasTHOUGHT</title>
  <link rel="stylesheet" href="/share/share.css">
  <script src="/share/share.js" defer></script>
</head>
<body>
  <header class="site-head">
    <a class="brand" href="https://www.atlasthought.dev/rafiq.html" aria-label="Rafiq app page">atlasTHOUGHT <span>· Rafiq</span></a>
  </header>
  <main class="wrap">
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Shared from Rafiq</p>
      <h1 id="page-title">A moment to read and reflect</h1>
      <p id="reference" class="reference" hidden></p>
      <div id="content" class="content" aria-live="polite"></div>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="actions">
        <button id="copy-link" type="button">Copy link</button>
        <a id="open-in-app" class="button secondary" href="#">Open in Rafiq</a>
        <a class="button secondary" href="https://www.atlasthought.dev/rafiq.html">About Rafiq</a>
      </div>
    </section>
    <footer>Shared text is displayed as provided by the person who created the link. <a href="https://www.atlasthought.dev/rafiq-privacy.html">Rafiq Privacy Policy</a></footer>
  </main>
</body>
</html>
